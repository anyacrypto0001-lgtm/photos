<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Petique Photobooth</title>
<meta name="description" content="Photobooth hire: photo strips, GIFs, boomerangs and video messages.">
<!--
  Le Petique public website. Everything on it (words, prices, pictures, colours, links) is edited in site-editor.html
  and kept in your Supabase project, so changing it never needs a re-upload. Host this file next to config.js
  (your project's address and public key: copy config.example.js, fill it in, and upload it as config.js).
  Without config.js the page shows the built-in sample text, and the contact form opens the visitor's email app instead.
  Old QR codes that point here (with # details) are sent on to p/ so they keep working.
-->
<script>if(/[#&]u=/.test(location.hash))location.replace('p/'+location.hash)</script>
<script src="config.js"></script>
<style>
:root{--a:#ff5a7a;--bg:#141014;--panel:#221a22;--ink:#fbf5ef;--mute:#bcaeb7;--aink:#fff;--hf:'Playfair Display',Georgia,serif;--bf:'Outfit',system-ui,sans-serif;--line:color-mix(in srgb,var(--ink) 16%,var(--bg))}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--bf);line-height:1.55;-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:var(--hf);line-height:1.15;margin:0 0 .4em;font-weight:700}
h1{font-size:clamp(38px,8vw,72px)}h2{font-size:clamp(28px,5vw,42px);text-align:center}h3{font-size:22px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
section{padding:64px 0}
.mute{color:var(--mute)}
.btn{display:inline-block;padding:14px 28px;border-radius:999px;background:var(--a);color:var(--aink);font-weight:700;text-decoration:none;border:0;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:18px;height:58px}
.brand{font-family:var(--hf);font-size:22px;font-weight:700;text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:10px}
.brand img{height:34px;width:auto}
nav .links{margin-left:auto;display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
nav .links a{text-decoration:none;color:var(--mute);font-size:15px}nav .links a:hover{color:var(--ink)}
.hero{text-align:center;padding:96px 0 88px;background-size:cover;background-position:center;position:relative}
.hero.img::before{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 62%,transparent)}
.hero .wrap{position:relative}
.hero p.sub{font-size:clamp(17px,2.4vw,22px);color:var(--mute);max-width:620px;margin:0 auto 28px}
.hero .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.about p{max-width:700px;margin:0 auto;text-align:center;font-size:18px;color:var(--mute);white-space:pre-line}
.lead{text-align:center;color:var(--mute);max-width:620px;margin:0 auto 36px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;position:relative;display:flex;flex-direction:column;gap:10px}
.card.pop{border-color:var(--a);box-shadow:0 0 0 1px var(--a)}
.tag{position:absolute;top:-12px;left:22px;background:var(--a);color:var(--aink);font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
.price{font-family:var(--hf);font-size:34px;font-weight:700}.price small{font-family:var(--bf);font-size:15px;font-weight:400;color:var(--mute)}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;color:var(--mute)}
.card li::before{content:"✓";color:var(--a);font-weight:700;margin-right:8px}
.gal{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.gal button{padding:0;border:0;background:var(--panel);border-radius:14px;overflow:hidden;cursor:zoom-in;aspect-ratio:3/4}
.gal img{width:100%;height:100%;object-fit:cover}
.stars{color:var(--a);letter-spacing:2px}
.rev p{margin:0;font-size:17px}.rev b{color:var(--mute);font-weight:600}
details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin:0 auto 10px;max-width:760px}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:14px}
summary::after{content:"+";font-size:22px;line-height:1;color:var(--a)}details[open] summary::after{content:"–"}
details p{margin:12px 0 0;color:var(--mute);white-space:pre-line}
form{max-width:560px;margin:0 auto;display:grid;gap:12px}
label{display:grid;gap:5px;font-size:14px;color:var(--mute)}
input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--a);outline-offset:1px}
.hp{position:absolute;left:-9999px;opacity:0}
.msg{text-align:center;min-height:1.4em;margin:4px 0 0}.msg.ok{color:#6fd98f}.msg.bad{color:#ff8a8a}
.quick{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
footer{border-top:1px solid var(--line);padding:36px 0 48px;text-align:center}
.soc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.soc a{padding:9px 18px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font-size:15px}.soc a:hover{border-color:var(--a)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:20px}
.lb img{max-height:92vh;border-radius:10px}
.lb[hidden]{display:none}
@media(max-width:560px){section{padding:44px 0}.hero{padding:64px 0}nav .links{display:none}}
</style>
</head>
<body>
<div id="site"></div>
<div class="lb" id="lb" hidden><img id="lbImg" alt=""></div>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
/* the sample content: shown until the site has been edited, and fills in anything left blank */
var DEFAULT={
  brand:{name:'Le Petique Photobooth',logo:''},
  look:{accent:'#ff5a7a',bg:'#141014',panel:'#221a22',ink:'#fbf5ef',mute:'#bcaeb7',headFont:'Playfair Display',bodyFont:'Outfit'},
  hero:{title:'Little moments, beautifully kept',sub:'A photobooth for weddings, parties and brand events. Photo strips, GIFs, boomerangs and video messages, shared to every guest by QR code.',image:'',cta:'Ask for a quote'},
  about:{title:'About us',text:''},
  packages:[
    {id:'p1',name:'Classic strip',price:'',per:'',desc:'Printed photo strips guests take home.',items:['Unlimited sessions','Printed strips','Online gallery for guests'],popular:false},
    {id:'p2',name:'Full experience',price:'',per:'',desc:'Strips, GIFs, boomerangs and video messages.',items:['Everything in Classic','GIFs and boomerangs','Video message guest book','Custom design'],popular:true}],
  gallery:[],reviews:[],faq:[],
  socials:{instagram:'',tiktok:'',facebook:'',youtube:'',whatsapp:'',email:''},
  contact:{title:'Get in touch',intro:'Tell us about your event and we will get back to you.'},
  seo:{title:'',description:'',image:''},
  sections:[{k:'hero',on:true},{k:'about',on:true},{k:'packages',on:true},{k:'gallery',on:true},{k:'reviews',on:true},{k:'faq',on:true},{k:'contact',on:true}]
};
var NAMES={about:'About',packages:'Packages',gallery:'Gallery',reviews:'Reviews',faq:'FAQ',contact:'Contact'};
var CFG=window.LP_SITE||{},C=DEFAULT,PREVIEW=/[?&]preview\b/.test(location.search);
function isObj(x){return x&&typeof x==='object'&&!Array.isArray(x)}
function merge(a,b){var o={},k;for(k in a)o[k]=a[k];if(isObj(b))for(k in b){if(isObj(a[k])&&isObj(b[k]))o[k]=merge(a[k],b[k]);else if(b[k]!==undefined&&b[k]!==null)o[k]=b[k]}return o}
function safeUrl(u){u=String(u||'').trim();return /^(https?:\/\/|\/|\.\/|[\w-]+\/)/i.test(u)&&!/^javascript:/i.test(u)?u:''}
function link(u){u=String(u||'').trim();return /^(https?:|mailto:|tel:)/i.test(u)?u:''}
var FONT_SAFE=/^[A-Za-z0-9 ]{2,40}$/;
function loadFonts(){var f=[C.look.headFont,C.look.bodyFont].filter(function(x,i,a){return FONT_SAFE.test(x||'')&&a.indexOf(x)===i});
  if(!f.length)return;var id='lpfonts',el=document.getElementById(id)||document.head.appendChild(Object.assign(document.createElement('link'),{id:id,rel:'stylesheet'}));
  el.href='https://fonts.googleapis.com/css2?'+f.map(function(x){return'family='+x.replace(/ /g,'+')+':wght@400;600;700'}).join('&')+'&display=swap'}
function social(){var s=C.socials||{},o=[];
  function h(v){return String(v||'').trim().replace(/^@/,'')}
  function url(v,base){v=String(v||'').trim();if(!v)return'';return /^https?:\/\//i.test(v)?v:base+h(v)}
  if(s.instagram)o.push(['Instagram',url(s.instagram,'https://instagram.com/')]);
  if(s.tiktok)o.push(['TikTok',url(s.tiktok,'https://tiktok.com/@')]);
  if(s.facebook)o.push(['Facebook',url(s.facebook,'https://facebook.com/')]);
  if(s.youtube)o.push(['YouTube',url(s.youtube,'https://youtube.com/@')]);
  if(s.whatsapp){var d=String(s.whatsapp).replace(/\D/g,'');if(d)o.push(['WhatsApp','https://wa.me/'+d])}
  if(s.email&&/^[^\s@]+@[^\s@]+$/.test(s.email))o.push(['Email','mailto:'+s.email.trim()]);
  return o.filter(function(x){return link(x[1])})}
var R={
  hero:function(){var h=C.hero,img=safeUrl(h.image);
    return'<header class="hero'+(img?' img':'')+'"'+(img?' style="background-image:url(\''+esc(img)+'\')"':'')+'><div class="wrap"><h1>'+esc(h.title)+'</h1><p class="sub">'+esc(h.sub)+'</p><div class="btns">'+(on('contact')?'<a class="btn" href="#contact">'+esc(h.cta||'Get in touch')+'</a>':'')+(on('packages')?'<a class="btn alt" href="#packages">See packages</a>':'')+'</div></div></header>'},
  about:function(){var a=C.about;if(!String(a.text||'').trim())return'';return'<section id="about" class="about"><div class="wrap"><h2>'+esc(a.title)+'</h2><p>'+esc(a.text)+'</p></div></section>'},
  packages:function(){var p=(C.packages||[]).filter(function(x){return x&&x.name});if(!p.length)return'';
    return'<section id="packages"><div class="wrap"><h2>Packages</h2><p class="lead">Every package includes a friendly attendant, setup and a gallery link for your guests.</p><div class="grid">'+p.map(function(x){
      return'<div class="card'+(x.popular?' pop':'')+'">'+(x.popular?'<span class="tag">Most popular</span>':'')+'<h3>'+esc(x.name)+'</h3>'+(x.price?'<div class="price">'+esc(x.price)+(x.per?' <small>'+esc(x.per)+'</small>':'')+'</div>':'')+(x.desc?'<div class="mute">'+esc(x.desc)+'</div>':'')+((x.items||[]).length?'<ul>'+x.items.map(function(i){return'<li>'+esc(i)+'</li>'}).join('')+'</ul>':'')+(on('contact')?'<a class="btn'+(x.popular?'':' alt')+'" style="margin-top:auto;text-align:center" href="#contact" data-pk="'+esc(x.name)+'">Enquire</a>':'')+'</div>'}).join('')+'</div></div></section>'},
  gallery:function(){var g=(C.gallery||[]).filter(function(x){return x&&safeUrl(x.url)});if(!g.length)return'';
    return'<section id="gallery"><div class="wrap"><h2>Gallery</h2><div class="gal">'+g.map(function(x){return'<button type="button" data-img="'+esc(safeUrl(x.url))+'" aria-label="'+esc(x.alt||'Open photo')+'"><img loading="lazy" src="'+esc(safeUrl(x.url))+'" alt="'+esc(x.alt||'')+'"></button>'}).join('')+'</div></div></section>'},
  reviews:function(){var r=(C.reviews||[]).filter(function(x){return x&&x.text});if(!r.length)return'';
    return'<section id="reviews"><div class="wrap"><h2>Kind words</h2><div class="grid">'+r.map(function(x){var n=Math.max(0,Math.min(5,+x.stars||5));
      return'<div class="card rev"><div class="stars" aria-label="'+n+' out of 5">'+'★'.repeat(n)+'☆'.repeat(5-n)+'</div><p>“'+esc(x.text)+'”</p>'+(x.name?'<b>'+esc(x.name)+'</b>':'')+'</div>'}).join('')+'</div></div></section>'},
  faq:function(){var f=(C.faq||[]).filter(function(x){return x&&x.q});if(!f.length)return'';
    return'<section id="faq"><div class="wrap"><h2>Questions</h2>'+f.map(function(x){return'<details><summary>'+esc(x.q)+'</summary><p>'+esc(x.a)+'</p></details>'}).join('')+'</div></section>'},
  contact:function(){var c=C.contact,q=social().filter(function(x){return/WhatsApp|Email/.test(x[0])});
    return'<section id="contact"><div class="wrap"><h2>'+esc(c.title)+'</h2><p class="lead">'+esc(c.intro)+'</p>'+
      '<form id="eq" novalidate><label>Your name<input name="n" maxlength="80" autocomplete="name" required></label><label>Email or phone<input name="c" maxlength="120" autocomplete="email" required></label>'+
      '<label>Event date <input name="d" maxlength="40" placeholder="e.g. 14 June"></label><label>Message<textarea name="m" rows="4" maxlength="2000" placeholder="What are you planning?"></textarea></label>'+
      '<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="btn" type="submit">Send message</button><p class="msg" id="eqMsg" role="status"></p></form>'+
      (q.length?'<div class="quick">'+q.map(function(x){return'<a class="btn alt" href="'+esc(x[1])+'" rel="noopener">'+x[0]+'</a>'}).join('')+'</div>':'')+'</div></section>'}
};
function on(k){return(C.sections||[]).some(function(s){return s.k===k&&s.on!==false})}
function render(){
  var L=C.look,st=document.documentElement.style,sc=C.sections||[];
  st.setProperty('--a',L.accent);st.setProperty('--bg',L.bg);st.setProperty('--panel',L.panel);st.setProperty('--ink',L.ink);st.setProperty('--mute',L.mute);
  st.setProperty('--hf',"'"+(FONT_SAFE.test(L.headFont||'')?L.headFont:'Playfair Display')+"',Georgia,serif");st.setProperty('--bf',"'"+(FONT_SAFE.test(L.bodyFont||'')?L.bodyFont:'Outfit')+"',system-ui,sans-serif");
  var lum=function(h){h=String(h).replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');var n=parseInt(h,16)||0;return(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255};
  st.setProperty('--aink',lum(L.accent)>.62?'#111':'#fff');loadFonts();
  var name=esc(C.brand.name),logo=safeUrl(C.brand.logo),links=sc.filter(function(s){return s.on!==false&&NAMES[s.k]&&R[s.k]&&R[s.k]()}).map(function(s){return'<a href="#'+s.k+'">'+NAMES[s.k]+'</a>'}).join('');
  var body=sc.filter(function(s){return s.on!==false&&R[s.k]}).map(function(s){return R[s.k]()}).join('');
  var soc=social();
  $('#site').innerHTML='<nav><div class="wrap"><a class="brand" href="#">'+(logo?'<img src="'+esc(logo)+'" alt="">':'')+name+'</a><div class="links">'+links+'</div></div></nav>'+body+
    '<footer><div class="wrap">'+(soc.length?'<div class="soc">'+soc.map(function(x){return'<a href="'+esc(x[1])+'" rel="noopener">'+x[0]+'</a>'}).join('')+'</div>':'')+'<p class="mute">© '+new Date().getFullYear()+' '+name+'</p></div></footer>';
  var t=(C.seo.title||'').trim()||C.brand.name;document.title=t;
  function meta(n,v,prop){var s=prop?'meta[property="'+n+'"]':'meta[name="'+n+'"]',m=$(s);if(!m){m=document.createElement('meta');m.setAttribute(prop?'property':'name',n);document.head.appendChild(m)}m.content=v}
  var ds=(C.seo.description||'').trim()||DEFAULT.seo.description||document.querySelector('meta[name=description]').content;
  meta('description',ds);meta('og:title',t,1);meta('og:description',ds,1);var im=safeUrl(C.seo.image);if(im)meta('og:image',im,1);
  var fav=safeUrl(C.brand.logo);if(fav){var l=$('link[rel=icon]')||document.head.appendChild(Object.assign(document.createElement('link'),{rel:'icon'}));l.href=fav}
}
/* gallery lightbox, package buttons fill in the enquiry */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-img]');if(b){$('#lbImg').src=b.dataset.img;$('#lb').hidden=false;return}
  if(e.target.closest('#lb')){$('#lb').hidden=true;return}
  var p=e.target.closest('[data-pk]');if(p){var m=$('#eq textarea');if(m&&!m.value)m.value='I am interested in the '+p.dataset.pk+' package. '}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')$('#lb').hidden=true});
document.addEventListener('submit',function(e){
  if(e.target.id!=='eq')return;e.preventDefault();
  var f=e.target,msg=$('#eqMsg'),v=function(n){return f.elements[n].value.trim()},btn=f.querySelector('button');
  msg.className='msg';
  if(f.elements.website.value)return; /* a hidden field only robots fill in */
  if(!v('n')||!v('c')){msg.className='msg bad';msg.textContent='Please add your name and an email or phone number.';return}
  if(PREVIEW){msg.className='msg ok';msg.textContent='(Preview) The message would be sent now.';return}
  if(!CFG.url||!CFG.key){ /* no project set up: use the visitor's own email app */
    var to=(C.socials.email||'').trim();if(!to){msg.className='msg bad';msg.textContent='Sorry, the form is not set up yet.';return}
    location.href='mailto:'+to+'?subject='+encodeURIComponent('Enquiry from '+v('n'))+'&body='+encodeURIComponent(v('m')+'\n\nEvent date: '+v('d')+'\nContact: '+v('c'));return}
  btn.disabled=true;msg.textContent='Sending…';
  fetch(CFG.url+'/rest/v1/rpc/enquiry_send',{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json'},body:JSON.stringify({p_name:v('n'),p_contact:v('c'),p_date:v('d'),p_message:v('m')})})
   .then(function(r){return r.text().then(function(t){if(!r.ok)throw new Error(/too many/i.test(t)?'many':'fail');})})
   .then(function(){f.reset();msg.className='msg ok';msg.textContent='Thank you! We will be in touch very soon.'})
   .catch(function(er){msg.className='msg bad';msg.textContent=er.message==='many'?'That is a lot of messages in a short time. Please try again later.':'Sorry, that did not send. Please try again, or use the email button.'})
   .then(function(){btn.disabled=false})});
/* the site editor shows a live preview: it posts the draft here */
addEventListener('message',function(e){if(e.source!==parent||!e.data||!e.data.lpSite)return;C=merge(DEFAULT,e.data.lpSite);render()});
render();
if(PREVIEW&&parent!==window)parent.postMessage({lpSiteReady:1},'*');
if(CFG.url&&CFG.key&&!PREVIEW){
  fetch(CFG.url+'/rest/v1/rpc/site_get',{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json'},body:'{}'})
   .then(function(r){return r.ok?r.json():null}).then(function(d){if(isObj(d)&&Object.keys(d).length){C=merge(DEFAULT,d);render()}}).catch(function(){});
}
})();
</script>
</body>
</html>
